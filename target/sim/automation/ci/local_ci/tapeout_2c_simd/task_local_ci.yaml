# Tasks for the HEMAIA TO 2C_SIMD CFG only (hemaia_tapeout_2c_simd.hjson).
# 4 chiplets, 2x snax_versacore_to_256KB_simd_cluster per chiplet.
#
# The SIMD clusters contain the base GEMM cores and all other 2C functionality,
# so this suite runs every task from tapeout_2c first. The SIMD-specific task
# (the minimal 2-cluster xDMA softmax) is appended after the base tasks.

runs:
  # ---- host_only / multi_chip ----
  # system_xdma_copy
  - HOST_APP_TYPE: host_only
    CHIP_TYPE: multi_chip
    WORKLOAD: system_xdma_copy
    DEV_APP: None
  # system_idma_copy
  - HOST_APP_TYPE: host_only
    CHIP_TYPE: multi_chip
    WORKLOAD: system_idma_copy
    DEV_APP: None

  # ---- offload_bingo_hw / single_chip ----
  # dummy_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: single_chip
    WORKLOAD: dummy_2cluster
    DEV_APP: snax-bingo-offload
  # ---- offload_bingo_hw / multi_chip ----
  # gemm_msplit_4chiplet_2cluster_basic
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_msplit_4chiplet_2cluster_basic
    DEV_APP: snax-bingo-offload
  # gemm_msplit_4chiplet_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_msplit_4chiplet_2cluster
    DEV_APP: snax-bingo-offload
  # gemm_ksplit_4chiplet_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_ksplit_4chiplet_2cluster
    DEV_APP: snax-bingo-offload
  # idma_read_from_chip00_4chiplet_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: idma_read_from_chip00_4chiplet_2cluster
    DEV_APP: snax-bingo-offload
  # xdma_read_from_chip00_4chiplet_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: xdma_read_from_chip00_4chiplet_2cluster
    DEV_APP: snax-bingo-offload
  # ---- offload_legacy / single_chip ----
  # versacore-matmul-profile-2cluster-4chip
  - HOST_APP_TYPE: offload_legacy
    CHIP_TYPE: single_chip
    WORKLOAD: None
    DEV_APP: versacore-matmul-profile-2cluster-4chip
  # versacore-matmul-profile-2cluster-4chip-d2d
  - HOST_APP_TYPE: offload_legacy
    CHIP_TYPE: single_chip
    WORKLOAD: None
    DEV_APP: versacore-matmul-profile-2cluster-4chip-d2d

  # ---- SIMD-only offload_bingo_hw / single_chip ----
  # xdma_softmax_simd_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: single_chip
    WORKLOAD: xdma_softmax_simd_2cluster
    DEV_APP: snax-bingo-offload
