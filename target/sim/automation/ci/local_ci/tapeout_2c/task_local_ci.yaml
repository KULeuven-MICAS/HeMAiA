# Tasks for the HEMAIA TO 2C CFG only (hemaia_tapeout_2c.hjson).
# 4 chiplets, 2x snax_versacore_to_256KB_cluster per chiplet.
#
# Offload workloads in this list must target 2 clusters: guard_cluster_count()
# rejects a workload whose params.hjson `num_clusters` differs from the cfg's
# cluster count, and the app then fails to link. The host-only system DMA tests
# do not access cluster TCDM and are independent of the cluster count.
#
# dummy_2cluster is a placeholder that exercises the boot + bingo DFG path.

runs:
  # ---- host_only / single_chip ----
  # io_drive_strength. Cluster-count independent, but worth running here as well
  # as on the 1C suites: NumMailboxRegs tracks the cluster count, so the SoC
  # control registers after it sit at a different offset on a 2-cluster config.
  - HOST_APP_TYPE: host_only
    CHIP_TYPE: single_chip
    WORKLOAD: io_drive_strength
    DEV_APP: None

  # ---- host_only / multi_chip ----
  # system_xdma_copy
  - HOST_APP_TYPE: host_only
    CHIP_TYPE: multi_chip
    WORKLOAD: system_xdma_copy
    DEV_APP: None
  # system_idma_copy
  - HOST_APP_TYPE: host_only
    CHIP_TYPE: multi_chip
    WORKLOAD: system_idma_copy
    DEV_APP: None

  # ---- offload_bingo_hw / single_chip ----
  # dummy_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: single_chip
    WORKLOAD: dummy_2cluster
    DEV_APP: snax-bingo-offload
  # ---- offload_bingo_hw / multi_chip ----
  # gemm_msplit_4chiplet_2cluster_basic
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_msplit_4chiplet_2cluster_basic
    DEV_APP: snax-bingo-offload
  # gemm_msplit_4chiplet_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_msplit_4chiplet_2cluster
    DEV_APP: snax-bingo-offload
  # gemm_ksplit_4chiplet_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_ksplit_4chiplet_2cluster
    DEV_APP: snax-bingo-offload
  # xdma_read_from_chip00_4chiplet_2cluster
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: xdma_read_from_chip00_4chiplet_2cluster
    DEV_APP: snax-bingo-offload
  # ---- offload_legacy / single_chip ----
  # snax-xdma-hazard: simultaneous L3/TCDM traffic plus bidirectional
  # nearest-neighbor reads and writes across every cluster boundary.
  - HOST_APP_TYPE: offload_legacy
    CHIP_TYPE: single_chip
    WORKLOAD: None
    DEV_APP: snax-xdma-hazard
  # versacore-matmul-profile-2cluster-4chip
  - HOST_APP_TYPE: offload_legacy
    CHIP_TYPE: single_chip
    WORKLOAD: None
    DEV_APP: versacore-matmul-profile-2cluster-4chip

  # ---- offload_bingo_hw / multi_chip : gemm_parametric ----
  # Three 8-worker rungs of the M/K/N-split ladder, one parameterised workload
  # entered three times through HOST_DATA_CFG. The shapes live in params/.
  #
  # grid 2/2/2: the first K reduction. w_k maps to the cluster axis, so both
  # partials of an (m,n) cell land on one chiplet and the reduction is a host
  # add_i32 there rather than a sum over D2D.
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_parametric
    DEV_APP: snax-bingo-offload
    HOST_DATA_CFG: target/sw/host/apps/offload_bingo_hw/multi_chip/workloads/gemm_parametric/params/grid2x2x2_4chip_2c.hjson
  # tilepack: the fast load/store path with a 2x2 tile grid, so the tile-pack
  # offset formula runs with both indices nonzero. Checks cover all of D.
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_parametric
    DEV_APP: snax-bingo-offload
    HOST_DATA_CFG: target/sw/host/apps/offload_bingo_hw/multi_chip/workloads/gemm_parametric/params/grid2x2x2_4chip_2c_tilepack.hjson
  # accumprevc: inner_tile_K below the K share, so every k_idx > 0 accumulates
  # into the VersaCore register. That accumulator holds one tile, so the path is
  # only correct at inner_tile_M == inner_tile_N == 1; with 2x2 it returns
  # sign-flipped results and no error. If this ever mismatches, check the tile
  # shape first.
  - HOST_APP_TYPE: offload_bingo_hw
    CHIP_TYPE: multi_chip
    WORKLOAD: gemm_parametric
    DEV_APP: snax-bingo-offload
    HOST_DATA_CFG: target/sw/host/apps/offload_bingo_hw/multi_chip/workloads/gemm_parametric/params/grid2x2x2_4chip_2c_accumprevc.hjson
